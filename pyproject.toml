[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caliper-harness"
version = "0.0.1"
description = "Caliper: a lightweight, extensible coding-agent harness with an evidence gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
rag = ["fastembed>=0.7", "sqlite-vec>=0.1.6"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
pg = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
cal = "caliper.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
